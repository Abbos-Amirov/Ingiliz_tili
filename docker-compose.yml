services:
  backend:
    build:
      context: ./backend
    image: ingiliztili-backend
    ports:
      - "5051:5051"
    env_file:
      - ./backend/.env
    volumes:
      # Persists auto-generated audio (see tts.service.ts) across
      # `docker compose up --build` rebuilds — otherwise it'd be baked into
      # the old image layer and lost on every redeploy.
      - ./backend/public/audio:/app/public/audio
      # Firebase service account key (see config/firebase.ts) — mounted
      # rather than copied into the image so it never ends up baked into a
      # Docker layer; deployed to the host directory manually, same as .env.
      - ./backend/secrets:/app/secrets:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — override for a real
        # deployment, e.g. NEXT_PUBLIC_API_BASE_URL=https://api.example.com/api
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5051/api}
    image: ingiliztili-frontend
    ports:
      - "5050:5050"
    depends_on:
      - backend
    restart: unless-stopped
