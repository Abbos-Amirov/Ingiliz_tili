services:
  backend:
    build:
      context: ./backend
    image: ingiliztili-backend
    ports:
      - "5051:5051"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — override for a real
        # deployment, e.g. NEXT_PUBLIC_API_BASE_URL=https://api.example.com/api
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5051/api}
    image: ingiliztili-frontend
    ports:
      - "5050:5050"
    depends_on:
      - backend
    restart: unless-stopped
